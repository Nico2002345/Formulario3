<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Lista de Asistencia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="container-fluid">
    <div class="header-row">
      <div class="logo-slot" id="logoLeft">
        <img src="assets/logos/vaupes.png" alt="Logo Vaupés">
      </div>

      <div class="header-title">
        <h1>Lista de Asistencia</h1>
        <p class="text-muted mb-0">Departamento de Vaupés · Sistema de Listas de Asistencia</p>
      </div>

      <div class="logo-slot" id="logoRight">
        <img src="assets/logos/educacion.png" alt="Logo Secretaría de Educación Departamental">
      </div>
    </div>
  </div>
</header>

<main class="container-fluid py-5">
  <div class="d-flex justify-content-center">
    <div class="card evento-card" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h2 class="h5 mb-1 text-center"><i class="bi bi-shield-lock"></i> Acceso de administrador</h2>
        <p class="text-muted small text-center mb-3">Esta vista general administra todos los departamentos.</p>
        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" class="form-control" id="password" required autofocus>
          </div>
          <p id="loginError" class="text-danger small d-none">Contraseña incorrecta.</p>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    errorEl.classList.add('d-none');
    try {
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (!res.ok) {
        errorEl.textContent = (await res.json()).error || 'No se pudo iniciar sesión';
        errorEl.classList.remove('d-none');
        return;
      }
      window.location.href = '/';
    } catch (err) {
      errorEl.textContent = 'Error de conexión, intenta de nuevo';
      errorEl.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
